[package]
name = "lossless-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alsa = "0.12.1"
lossless-proto.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3"] }
thiserror = "2"

[dependencies.flacenc]
version = "0.5.1"
default-features = false
optional = true

[features]
# Test fixtures (FLAC files with known samples) for other crates' tests.
# Only enabled from dev-dependencies: never part of a release build.
fixtures = ["dep:flacenc"]

[dev-dependencies]
anyhow = "1.0.104"
flacenc = { version = "0.5.1", default-features = false }
proptest = "1.12.0"
