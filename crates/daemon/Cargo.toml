[package]
name = "lossless-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lossless_daemon"
path = "src/lib.rs"

[[bin]]
name = "losslessd"
path = "src/main.rs"

[dependencies]
lossless-proto.workspace = true
lossless-engine.workspace = true
lossless-library.workspace = true
anyhow = "1.0.104"
thiserror = "2"
log = "0.4"
toml = "1.2.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
proptest = "1.12.0"
lossless-engine = { workspace = true, features = ["fixtures"] }
