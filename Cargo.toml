[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://codeberg.org/comodino/lossless"

[workspace.dependencies]
lossless-proto = { path = "crates/proto" }
lossless-engine = { path = "crates/engine" }
lossless-library = { path = "crates/library" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
